*{box-sizing:border-box}button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--font)}

.bar{height:8px;background:var(--sage);border-radius:9px;overflow:hidden;margin:6px 0 18px}.bar i{display:block;height:100%;background:var(--primary);transition:width .3s}
.cat{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--primary-hover)}
.opts{display:grid;gap:10px;margin:16px 0}.opts button{text-align:left}.opts .sel{background:var(--sage);border-color:var(--accent);font-weight:600}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.score{font-size:54px;font-weight:700;line-height:1}.row{margin:12px 0}.row .bar{margin:4px 0 0}
ul{padding-left:20px}li{margin:6px 0}.stack{display:grid;gap:14px}

.testbanner{background:#fff7e6;border:1px dashed #c9a85b;color:#6b4e12;border-radius:12px;padding:10px 12px;font-size:12px;letter-spacing:.3px}
.steps{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:#5b6f66}.steps .cur{color:var(--ink);font-weight:700}.steps .done{color:var(--primary-hover)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}.chip{min-height:40px;padding:8px 14px;border-radius:20px}.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.svc{line-height:1.5}.sugg{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:14px}.lbl{font-weight:600;margin:14px 0 4px;display:block}
input{font:inherit;width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:16px;color:var(--ink);background:#fff}input:focus{outline:3px solid var(--accent);outline-offset:1px}
.err{color:var(--warn);font-size:13px;margin:6px 0 0}.rev{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}.rev dt{color:#5b6f66}.rev dd{margin:0}
.bitem{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);padding:12px 0}.bitem.off{opacity:.55}.cx{color:var(--warn);border-color:#d4a596;min-height:40px}

const QS=[["sleep",0,"Tôi ngủ đủ giấc và thức dậy thấy khỏe.","I sleep enough and wake up refreshed."],

["stress",1,"Tôi thấy căng cứng ở vai, gáy hoặc lưng.","I feel tension in my shoulders, neck or back."],
["stress",1,"Tôi cảm thấy quá tải với công việc hoặc cuộc sống.","I feel overwhelmed by work or life."],
["energy",0,"Tôi có đủ năng lượng cho cả ngày.","I have enough energy to get through the day."],
["energy",1,"Tôi thấy mệt mỏi dù đã nghỉ ngơi.","I feel tired even after resting."],
["nutrition",0,"Tôi ăn bữa ăn cân bằng, nhiều rau và uống đủ nước.","I eat balanced meals with vegetables and drink enough water."],
["nutrition",1,"Tôi bỏ bữa hoặc ăn vội vì bận rộn.","I skip meals or eat in a rush because I'm busy."],

["mood",0,"Tôi cảm thấy bình yên và hài lòng.","I feel calm and content."],
["mood",1,"Tôi dễ cáu gắt hoặc buồn bã.","I feel irritable or low."]];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get(CONFIG.storageKey+"-lang")||CONFIG.defaultLang,i=-1,ans=[],busy=false;
const $=id=>document.getElementById(id),app=$("app");
function load(){try{const d=JSON.parse(store.get(CONFIG.storageKey));return d&&Array.isArray(d.ans)&&d.ans.length===QS.length&&d.ans.every(v=>v>=0&&v<=4)?d:null}catch(e){return null}}

function compute(a){const s={};QS.forEach((q,k)=>{const v=q[1]?4-a[k]:a[k];(s[q[0]]=s[q[0]]||[]).push(v)});const c={};for(const k in s)c[k]=Math.round(s[k].reduce((x,y)=>x+y,0)/(s[k].length*4)*100);const o=Math.round(Object.values(c).reduce((x,y)=>x+y,0)/Object.keys(c).length);return{c,o}}

$("go").onclick=()=>{i=0;ans=[];render()};$("sbook").onclick=g(openBook);if(last)$("last").onclick=()=>{ans=last.ans;i=QS.length;render()};return}
if(i<QS.length){const q=QS[i];app.innerHTML=`<div class="muted">${t.q} ${i+1}${t.of}${QS.length}</div><div class="bar" role="progressbar" aria-valuenow="${i}" aria-valuemax="${QS.length}"><i style="width:${i/QS.length*100}%"></i></div><div class="card"><div class="cat">${CATS[q[0]][lang]}</div><h2>${lang=="vi"?q[2]:q[3]}</h2><div class="opts">${t.opts.map((o,k)=>`<button data-k="${k}" class="${ans[i]===k?"sel":""}">${o}</button>`).join("")}</div><div class="nav"><button id="bk" ${i==0?"disabled":""}>${t.back}</button><button class="primary" id="nx" ${ans[i]==null?"disabled":""}>${i==QS.length-1?t.finish:t.next}</button></div></div>`;
app.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{if(busy)return;busy=true;ans[i]=+b.dataset.k;render();setTimeout(()=>{busy=false;if(i<QS.length&&ans[i]!=null){i++;if(i==QS.length)save()}render()},180)});

<div class="card">${Object.entries(r.c).map(([k,v])=>`<div class="row"><div class="nav"><span>${CATS[k][lang]}</span><b>${v}</b></div><div class="bar"><i style="width:${v}%"></i></div></div>`).join("")}</div>

const fmt=n=>n.toLocaleString("vi-VN")+"₫",esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function g(fn){return(...a)=>{if(lock)return;lock=true;setTimeout(()=>lock=false,350);fn(...a)}}
function days(){const out=[];const d=new Date();d.setHours(0,0,0,0);for(let k=0;k<7;k++){const x=new Date(d);x.setDate(d.getDate()+k);out.push(x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"))}return out}
function dLabel(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(lang=="vi"?"vi-VN":"en-US",{weekday:"short",day:"numeric",month:"numeric"})}
function slots(p,date){const now=new Date(),taken=getB().filter(b=>b.status=="active"&&b.pid==p.id&&b.date==date).map(b=>b.time);return p.times.filter(t=>{const[h,m]=t.split(":").map(Number);const[y,mo,d]=date.split("-").map(Number);return new Date(y,mo-1,d,h,m)>now&&!taken.includes(t)})}

function openMine(){view="mine";render();scrollTo(0,0)}
function validContact(c){const v=c.trim(),ph=v.replace(/[\s.\-()]/g,"");return /^(\+?84|0)\d{9,10}$/.test(ph)||/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)}
function price(){const p=PROVIDERS.find(x=>x.id==bk.pid);return p?Math.round(p.price*(bk.dur==90?1.4:1)):0}
function renderBook(){const t=BT[lang],q=T[lang];
 const banner=`<div class="testbanner" role="note">${t.test}</div>`;
 if(view=="mine"){const list=getB().slice().reverse();
  app.innerHTML=`<div class="stack">${banner}<div class="card"><h2>${t.mine}</h2>${list.length?list.map(b=>{const p=PROVIDERS.find(x=>x.id==b.pid)||{name:"?"};return `<div class="bitem${b.status!="active"?" off":""}"><div><b>${esc(p.name)}</b> · ${t.cats[p.cat]||""}<br><span class="muted">${dLabel(b.date)} · ${b.time} · ${b.dur} ${t.min} · ${fmt(b.price)}</span><br><span class="muted">${t.code} ${b.id} · ${b.status=="active"?t.active:t.cancelled}</span></div>${b.status=="active"?`<button class="cx" data-id="${b.id}">${t.cancel}</button>`:""}</div>`}).join(""):`<p class="muted">${t.empty}</p>`}<div class="nav" style="margin-top:14px"><button class="primary" id="bnew">${t.newb}</button><button id="bhome">${t.home}</button></div></div></div>`;
  app.querySelectorAll(".cx").forEach(b=>b.onclick=g(()=>{if(!confirm(t.sure))return;const a=getB();const x=a.find(y=>y.id==b.dataset.id);if(x)x.status="cancelled";setB(a);render()}));
  $("bnew").onclick=g(openBook);$("bhome").onclick=g(()=>{view=null;render();scrollTo(0,0)});return}
 const st=bk.step,steps=`<div class="steps">${t.steps.map((s,k)=>`<span class="${k==st?"cur":k<st?"done":""}">${k+1}. ${s}</span>`).join("")}</div><div class="bar"><i style="width:${(st+1)/4*100}%"></i></div>`;
 let body="";const p=PROVIDERS.find(x=>x.id==bk.pid);
 if(st==0){const s=suggestCat();const list=PROVIDERS.filter(x=>!bk.filter||x.cat==bk.filter);
  body=`<h2>${t.steps[0]}</h2>${s?`<p class="sugg">✧ ${t.suggest}: <b>${t.cats[s.cat]}</b> (${CATS[s.from][lang]})</p>`:""}<div class="chips">${["",...Object.keys(t.cats)].map(c=>`<button class="chip${bk.filter==c?" on":""}" data-c="${c}">${c?t.cats[c]:t.all}</button>`).join("")}</div>
  <div class="opts">${list.map(x=>`<button class="svc${bk.pid==x.id?" sel":""}" data-id="${x.id}"><b>${esc(x.name)}</b> · ${t.cats[x.cat]}<br><span class="muted">${x[lang]} · ${x.city}</span><br><b>${fmt(x.price)}</b> <span class="muted">${t.perh}</span></button>`).join("")}</div><p class="muted">${t.sample}</p>`}
 if(st==1){const sl=slots(p,bk.date);if(!sl.includes(bk.time))bk.time=null;
  body=`<h2>${esc(p.name)}</h2><p class="lbl">${t.date}</p><div class="chips">${days().map(d=>`<button class="chip dchip${bk.date==d?" on":""}" data-d="${d}">${dLabel(d)}</button>`).join("")}</div><p class="lbl">${t.time}</p>${sl.length?`<div class="chips">${sl.map(x=>`<button class="chip tchip${bk.time==x?" on":""}" data-t="${x}">${x}</button>`).join("")}</div>`:`<p class="muted">${t.none}</p>`}<p class="lbl">${t.dur}</p><div class="chips">${[60,90].map(m=>`<button class="chip mchip${bk.dur==m?" on":""}" data-m="${m}">${m} ${t.min}</button>`).join("")}</div><p><b>${fmt(price())}</b></p>`}
 if(st==2){body=`<h2>${t.steps[2]}</h2><label class="lbl" for="bname">${t.name}</label><input id="bname" autocomplete="name" value="${esc(bk.name)}">${bk.err.name?`<p class="err">${t.errName}</p>`:""}<label class="lbl" for="bcontact">${t.contact}</label><input id="bcontact" inputmode="email" autocomplete="tel" placeholder="${t.ePh}" value="${esc(bk.contact)}">${bk.err.contact?`<p class="err">${t.errContact}</p>`:""}`}
 if(st==3){body=`<h2>${t.review}</h2><dl class="rev"><dt>${t.steps[0]}</dt><dd>${esc(p.name)} · ${t.cats[p.cat]}</dd><dt>${t.steps[1]}</dt><dd>${dLabel(bk.date)} · ${bk.time} · ${bk.dur} ${t.min}</dd><dt>${t.name}</dt><dd>${esc(bk.name)}</dd><dt>${t.contact}</dt><dd>${esc(bk.contact)}</dd><dt>${t.total}</dt><dd><b>${fmt(price())}</b></dd></dl>`}
 if(st==4){const b=bk.saved;body=`<h2>✓ ${t.doneT}</h2><p>${esc(p.name)} · ${dLabel(b.date)} · ${b.time}</p><p class="muted">${t.code} <b>${b.id}</b></p><p class="muted">${t.doneP}</p>`}
 const canNext=st==0?!!bk.pid:st==1?!!bk.time:true;
 const navb=st==4?`<button class="primary" id="bmine">${t.mine}</button><button id="bhome">${t.home}</button>`:`<button id="bback">${t.back}</button><button class="primary" id="bnext" ${canNext?"":"disabled"}>${st==3?t.confirm:t.next}</button>`;
 app.innerHTML=`<div class="stack">${banner}<div class="card">${st<4?steps:""}${body}<div class="nav" style="margin-top:16px">${navb}</div></div><p class="muted" style="text-align:center"><a href="${CONFIG.bookingUrl}" target="_blank" rel="noopener">${t.pilot}</a></p></div>`;
 app.querySelectorAll(".chip[data-c]").forEach(b=>b.onclick=g(()=>{bk.filter=b.dataset.c;render()}));
 app.querySelectorAll(".svc").forEach(b=>b.onclick=g(()=>{bk.pid=+b.dataset.id;render()}));
 app.querySelectorAll(".dchip").forEach(b=>b.onclick=g(()=>{bk.date=b.dataset.d;render()}));
 app.querySelectorAll(".tchip").forEach(b=>b.onclick=g(()=>{bk.time=b.dataset.t;render()}));
 app.querySelectorAll(".mchip").forEach(b=>b.onclick=g(()=>{bk.dur=+b.dataset.m;render()}));
 if(st==2){const ci=(el,k)=>el.oninput=e=>{bk[k]=e.target.value;const n=el.nextElementSibling;if(n&&n.classList.contains("err")){n.remove();bk.err[k]=false}};ci($("bname"),"name");ci($("bcontact"),"contact");[$("bname"),$("bcontact")].forEach(x=>x.onkeydown=e=>{if(e.key=="Enter")$("bnext").click()})}
 const nx=$("bnext");if(nx)nx.onclick=g(()=>{if(st==0&&!bk.pid||st==1&&!bk.time)return;
  if(st==2){bk.err={name:bk.name.trim().length<2,contact:!validContact(bk.contact)};if(bk.err.name||bk.err.contact){render();return}}
  if(st==3){if(bk.saved)return;if(!slots(p,bk.date).includes(bk.time)){bk.step=1;render();return}
   const rec={id:"EM-"+Date.now().toString(36).toUpperCase().slice(-6),pid:p.id,date:bk.date,time:bk.time,dur:bk.dur,price:price(),name:bk.name.trim(),contact:bk.contact.trim(),at:Date.now(),status:"active",test:true};
   const a=getB();a.push(rec);setB(a);bk.saved=rec}
  bk.step++;render();scrollTo(0,0)});
 const bb=$("bback");if(bb)bb.onclick=g(()=>{if(bk.step==0){view=null}else bk.step--;render();scrollTo(0,0)});
 const bm=$("bmine");if(bm)bm.onclick=g(openMine);const bh=$("bhome");if(bh)bh.onclick=g(()=>{view=null;render();scrollTo(0,0)});
}

document.documentElement.lang=lang;render();
</script><script>if("serviceWorker" in navigator){let r=false;const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!r){r=true;location.reload()}});addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(g=>g.update()).catch(()=>{}))}</script></body></html>
