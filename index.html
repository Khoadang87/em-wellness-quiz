<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Êm Wellness — Self-check</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#264c3d"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="favicon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Êm Wellness"><meta name="description" content="Êm Wellness self-check quiz">
<style>
/* Brand tokens — matched to Êm Wellness pilot site */
:root{--ink:#213e35;--primary:#264c3d;--primary-hover:#40634d;--sage:#dce6ce;--paper:#f8f6ef;--line:#dce2d8;--accent:#8ca560;--soft:#edf1e5;--warn:#8a4233;--radius:16px;--font:Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--font)}
.notice{background:var(--primary);color:#fff;text-align:center;font-size:12px;letter-spacing:1px;padding:7px 12px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;background:#fff;border-bottom:1px solid var(--line);margin-bottom:18px}
.logo{height:64px;width:auto;display:block}.hero{display:block;height:150px;width:auto;margin:4px auto 14px}
main{max-width:560px;margin:0 auto;padding:0 18px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px}
button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;min-height:44px;padding:11px 17px;cursor:pointer}
button:hover{background:var(--soft)}.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.primary:hover{background:var(--primary-hover)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:default}
.lang button{min-height:36px;padding:6px 12px}.lang .on{background:var(--sage);font-weight:700}
h1{font-size:26px;line-height:1.25;margin:6px 0 10px}h2{font-size:19px;margin:0 0 14px}
.muted{color:#5b6f66;font-size:14px}.disc{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:13px;margin-top:16px}
.bar{height:8px;background:var(--sage);border-radius:9px;overflow:hidden;margin:6px 0 18px}.bar i{display:block;height:100%;background:var(--primary);transition:width .3s}
.cat{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--primary-hover)}
.opts{display:grid;gap:10px;margin:16px 0}.opts button{text-align:left}.opts .sel{background:var(--sage);border-color:var(--accent);font-weight:600}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.score{font-size:54px;font-weight:700;line-height:1}.row{margin:12px 0}.row .bar{margin:4px 0 0}
ul{padding-left:20px}li{margin:6px 0}.stack{display:grid;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:11px;min-height:44px;padding:11px 17px;border:1px solid var(--line);color:var(--ink);background:#fff}.btn:hover{background:var(--soft)}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.primary:hover{background:var(--primary-hover)}.btn.big{width:100%;font-size:17px;font-weight:700;min-height:52px}.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.book{background:var(--sage);border-color:var(--sage)}</style></head><body>
<div class="notice" id="notice"></div>
<header><img class="logo" src="logo.png" alt="Êm Wellness" width="38" height="64"><div class="lang"><button id="vi">VI</button> <button id="en">EN</button></div></header>
<main id="app"></main>
<script>
const CONFIG={brand:"Êm Wellness",storageKey:"em-wellness-quiz-v1",defaultLang:"vi",bookingUrl:"https://em-wellness-vietnam-khoa.hazy-pike-0157.chatgpt.site"};
const T={
vi:{notice:"TỰ ĐÁNH GIÁ · KHÔNG PHẢI CHẨN ĐOÁN Y KHOA",title:"Cơ thể bạn đang cần được êm đến đâu?",intro:"12 câu hỏi ngắn về giấc ngủ, căng thẳng, năng lượng, dinh dưỡng, vận động và tâm trạng. Khoảng 2 phút.",start:"Bắt đầu",resume:"Xem kết quả gần nhất",q:"Câu",of:"/",back:"Quay lại",next:"Tiếp",finish:"Xem kết quả",res:"Kết quả của bạn",overall:"Điểm cân bằng tổng thể",tips:"Gợi ý nhẹ nhàng",restart:"Làm lại",saved:"Đã lưu trên thiết bị này lúc",disc:"Bài tự đánh giá này chỉ mang tính tham khảo chung, không phải lời khuyên y khoa hay chẩn đoán. Nếu bạn lo lắng về sức khỏe thể chất hoặc tinh thần, hãy liên hệ bác sĩ hoặc chuyên gia.",
book:"Đặt lịch",bookNote:"Bản pilot: chỉ đặt lịch thử, chưa cung cấp dịch vụ thật.",bookLead:"Muốn được thư giãn? Đặt một buổi trên Êm Wellness.",opts:["Không bao giờ","Hiếm khi","Thỉnh thoảng","Thường xuyên","Luôn luôn"],
band:[[80,"Bạn đang khá cân bằng — hãy giữ nhịp này."],[60,"Khá ổn, có vài điểm cần chăm sóc thêm."],[40,"Cơ thể đang gửi tín hiệu cần nghỉ ngơi."],[0,"Hãy dành thời gian chậm lại và chăm sóc bản thân."]]},
en:{notice:"SELF-CHECK · NOT A MEDICAL DIAGNOSIS",title:"How much calm does your body need right now?",intro:"12 short questions on sleep, stress, energy, nutrition, movement and mood. About 2 minutes.",start:"Start",resume:"See last result",q:"Question",of:"/",back:"Back",next:"Next",finish:"See results",res:"Your results",overall:"Overall balance score",tips:"Gentle suggestions",restart:"Start over",saved:"Saved on this device at",disc:"This self-assessment is for general information only. It is not medical advice or a diagnosis. If you have concerns about your physical or mental health, please talk to a doctor or qualified professional.",
book:"Book a session",bookNote:"Pilot: test bookings only, not a live service yet.",bookLead:"Ready to unwind? Book a session with Êm Wellness.",opts:["Never","Rarely","Sometimes","Often","Always"],
band:[[80,"You're in good balance — keep this rhythm."],[60,"Fairly well, with a few areas to care for."],[40,"Your body is signalling it needs rest."],[0,"Make time to slow down and care for yourself."]]}};
const CATS={sleep:{vi:"Giấc ngủ",en:"Sleep",tip:{vi:"Giữ giờ ngủ cố định, tắt màn hình 30 phút trước khi ngủ.",en:"Keep a steady bedtime and switch off screens 30 minutes before sleep."}},
stress:{vi:"Căng thẳng",en:"Stress",tip:{vi:"Thử thở chậm 4-6 trong 3 phút, hoặc một buổi thư giãn cơ vai gáy.",en:"Try slow 4-6 breathing for 3 minutes, or a relaxing neck-and-shoulder session."}},
energy:{vi:"Năng lượng",en:"Energy",tip:{vi:"Nghỉ ngắn 5 phút mỗi giờ, đứng dậy và uống nước.",en:"Take a 5-minute break each hour — stand up and drink water."}},
nutrition:{vi:"Dinh dưỡng",en:"Nutrition",tip:{vi:"Thêm rau xanh vào mỗi bữa và uống đủ nước trong ngày.",en:"Add greens to each meal and drink enough water through the day."}},
movement:{vi:"Vận động",en:"Movement",tip:{vi:"Đi bộ nhẹ 20 phút hoặc giãn cơ sau giờ làm.",en:"Take a gentle 20-minute walk or stretch after work."}},
mood:{vi:"Tâm trạng",en:"Mood",tip:{vi:"Dành thời gian cho điều bạn thích và trò chuyện với người thân.",en:"Make time for something you enjoy and talk with someone close."}}};
// r:true = agreeing is a negative sign (reverse scored)
const QS=[["sleep",0,"Tôi ngủ đủ giấc và thức dậy thấy khỏe.","I sleep enough and wake up refreshed."],
["sleep",1,"Tôi khó ngủ hoặc hay thức giấc giữa đêm.","I have trouble falling or staying asleep."],
["stress",1,"Tôi thấy căng cứng ở vai, gáy hoặc lưng.","I feel tension in my shoulders, neck or back."],
["stress",1,"Tôi cảm thấy quá tải với công việc hoặc cuộc sống.","I feel overwhelmed by work or life."],
["energy",0,"Tôi có đủ năng lượng cho cả ngày.","I have enough energy to get through the day."],
["energy",1,"Tôi thấy mệt mỏi dù đã nghỉ ngơi.","I feel tired even after resting."],
["nutrition",0,"Tôi ăn bữa ăn cân bằng, nhiều rau và uống đủ nước.","I eat balanced meals with vegetables and drink enough water."],
["nutrition",1,"Tôi bỏ bữa hoặc ăn vội vì bận rộn.","I skip meals or eat in a rush because I'm busy."],
["movement",0,"Tôi vận động hoặc tập thể dục ít nhất 30 phút mỗi ngày.","I move or exercise at least 30 minutes a day."],
["movement",1,"Tôi ngồi một chỗ nhiều giờ liền.","I sit for many hours without a break."],
["mood",0,"Tôi cảm thấy bình yên và hài lòng.","I feel calm and content."],
["mood",1,"Tôi dễ cáu gắt hoặc buồn bã.","I feel irritable or low."]];
let lang=localStorage.getItem(CONFIG.storageKey+"-lang")||CONFIG.defaultLang,i=-1,ans=[];
const $=id=>document.getElementById(id),app=$("app");
function load(){try{return JSON.parse(localStorage.getItem(CONFIG.storageKey))}catch(e){return null}}
function setLang(l){lang=l;localStorage.setItem(CONFIG.storageKey+"-lang",l);document.documentElement.lang=l;render()}
$("vi").onclick=()=>setLang("vi");$("en").onclick=()=>setLang("en");
function compute(a){const s={};QS.forEach((q,k)=>{const v=q[1]?4-a[k]:a[k];(s[q[0]]=s[q[0]]||[]).push(v)});const c={};for(const k in s)c[k]=Math.round(s[k].reduce((x,y)=>x+y,0)/(s[k].length*4)*100);const o=Math.round(Object.values(c).reduce((x,y)=>x+y,0)/Object.keys(c).length);return{c,o}}
function render(){const t=T[lang];$("notice").textContent=t.notice;$("vi").className=lang=="vi"?"on":"";$("en").className=lang=="en"?"on":"";
if(i<0){const last=load();app.innerHTML=`<div class="card"><img class="hero" src="logo.png" alt=""><h1>${t.title}</h1><p class="muted">${t.intro}</p><div class="nav"><button class="primary" id="go">${t.start}</button><a class="btn" href="${CONFIG.bookingUrl}" target="_blank" rel="noopener">${t.book} ↗</a>${last?`<button id="last">${t.resume}</button>`:""}</div><div class="disc">${t.disc}</div></div>`;
$("go").onclick=()=>{i=0;ans=[];render()};if(last)$("last").onclick=()=>{ans=last.ans;i=QS.length;render()};return}
if(i<QS.length){const q=QS[i];app.innerHTML=`<div class="muted">${t.q} ${i+1}${t.of}${QS.length}</div><div class="bar" role="progressbar" aria-valuenow="${i}" aria-valuemax="${QS.length}"><i style="width:${i/QS.length*100}%"></i></div><div class="card"><div class="cat">${CATS[q[0]][lang]}</div><h2>${lang=="vi"?q[2]:q[3]}</h2><div class="opts">${t.opts.map((o,k)=>`<button data-k="${k}" class="${ans[i]===k?"sel":""}">${o}</button>`).join("")}</div><div class="nav"><button id="bk" ${i==0?"disabled":""}>${t.back}</button><button class="primary" id="nx" ${ans[i]==null?"disabled":""}>${i==QS.length-1?t.finish:t.next}</button></div></div>`;
app.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.k;setTimeout(()=>{i++;if(i==QS.length)save();render()},180);render()});
$("bk").onclick=()=>{i--;render()};$("nx").onclick=()=>{i++;if(i==QS.length)save();render()};return}
const r=compute(ans),saved=load(),band=t.band.find(b=>r.o>=b[0])[1],low=Object.entries(r.c).sort((a,b)=>a[1]-b[1]).slice(0,3);
app.innerHTML=`<div class="stack"><div class="card"><div class="cat">${t.res}</div><div class="score">${r.o}<span style="font-size:20px">/100</span></div><p class="muted">${t.overall}</p><p><b>${band}</b></p></div>
<div class="card">${Object.entries(r.c).map(([k,v])=>`<div class="row"><div class="nav"><span>${CATS[k][lang]}</span><b>${v}</b></div><div class="bar"><i style="width:${v}%"></i></div></div>`).join("")}</div>
<div class="card book"><h2>${t.bookLead}</h2><a class="btn primary big" id="bookbtn" href="${CONFIG.bookingUrl}" target="_blank" rel="noopener">${t.book} ↗</a><p class="muted" style="margin:10px 0 0">${t.bookNote}</p></div><div class="card"><h2>${t.tips}</h2><ul>${low.map(([k])=>`<li><b>${CATS[k][lang]}:</b> ${CATS[k].tip[lang]}</li>`).join("")}</ul>${saved?`<p class="muted">${t.saved} ${new Date(saved.at).toLocaleString(lang=="vi"?"vi-VN":"en-US")}</p>`:""}<button class="primary" id="rs">${t.restart}</button></div><div class="disc">${t.disc}</div></div>`;
$("rs").onclick=()=>{i=0;ans=[];render()}}
function save(){const r=compute(ans);localStorage.setItem(CONFIG.storageKey,JSON.stringify({ans,score:r.o,cats:r.c,at:Date.now()}))}
document.documentElement.lang=lang;render();
</script><script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"))</script></body></html>
