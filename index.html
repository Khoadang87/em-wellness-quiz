<script>
const CONFIG={brand:"Êm Wellness",storageKey:"em-wellness-quiz-v1",defaultLang:"vi",bookingUrl:"https://em-wellness-vietnam-khoa.hazy-pike-0157.chatgpt.site"};
const T={
vi:{notice:"PHIẾU SỨC KHỎE TRƯỚC MASSAGE · KHÔNG PHẢI CHẨN ĐOÁN Y KHOA",title:"Trước buổi massage, cho Êm biết một chút về bạn",intro:"9 câu hỏi ngắn về giấc ngủ, thói quen, vùng đau và sức khỏe. Khoảng 1 phút.",privacy:"🔒 Câu trả lời chỉ được lưu trên thiết bị này, không gửi đi đâu cả.",start:"Bắt đầu",resume:"Xem tóm tắt gần nhất",q:"Câu",of:"/",back:"Quay lại",next:"Tiếp tục",finish:"Xem tóm tắt",multi:"Chọn tất cả vùng phù hợp",res:"Tóm tắt phiếu sức khỏe",answers:"Câu trả lời của bạn",notes:"Lưu ý nhẹ nhàng",focus:"Gợi ý vùng tập trung khi massage:",nofocus:"Bạn không ghi nhận vùng đau — một buổi massage thư giãn toàn thân có thể phù hợp.",flagT:"Trước khi massage",flagNerve:"Bạn có ghi nhận vấn đề về thần kinh. Hãy cho kỹ thuật viên biết, và hỏi ý kiến bác sĩ trước khi massage nếu cần.",flagInf:"Bạn có ghi nhận một bệnh có thể lây truyền. Hãy trao đổi riêng với kỹ thuật viên và hỏi ý kiến bác sĩ trước khi massage để buổi chăm sóc an toàn cho bạn.",flagSkin:"Bạn có ghi nhận vết thương hở, bầm tím hoặc dễ chảy máu. Hãy cho kỹ thuật viên biết và hỏi ý kiến bác sĩ trước khi massage.",noDeep:"Nên tránh massage lực mạnh / ấn sâu.",sleepTip:"Giấc ngủ: giữ giờ ngủ cố định và tắt màn hình 30 phút trước khi ngủ có thể giúp ích.",allClear:"Không có lưu ý đặc biệt. Bạn vẫn có thể chia sẻ thêm với kỹ thuật viên trước buổi hẹn.",restart:"Làm lại",saved:"Đã lưu trên thiết bị này lúc",book:"Đặt lịch thử",bookNote:"Lịch hẹn thử: chỉ lưu trên máy này, không gửi đi, không thanh toán.",bookLead:"Muốn được thư giãn? Đặt một buổi trên Êm Wellness.",disc:"Phiếu này chỉ giúp bạn và kỹ thuật viên chuẩn bị cho buổi massage. Đây không phải lời khuyên y khoa hay chẩn đoán. Nếu bạn lo lắng về sức khỏe, hãy liên hệ bác sĩ."},
en:{notice:"PRE-MASSAGE HEALTH INTAKE · NOT A MEDICAL DIAGNOSIS",title:"Before your massage, tell Êm a little about you",intro:"9 short questions about sleep, habits, pain areas and health. About 1 minute.",privacy:"🔒 Your answers stay on this device only. Nothing is sent anywhere.",start:"Start",resume:"See last summary",q:"Question",of:"/",back:"Back",next:"Next",finish:"See summary",multi:"Select all that apply",res:"Intake summary",answers:"Your answers",notes:"Gentle notes",focus:"Suggested massage focus areas:",nofocus:"No pain areas noted — a relaxing full-body massage may suit you.",flagT:"Before your massage",flagNerve:"You noted a nerve-related issue. Please tell your therapist, and check with a doctor before massage if needed.",flagInf:"You noted a transmissible condition. Please let your therapist know privately and check with a doctor before massage so your session is safe for you.",flagSkin:"You noted open wounds, bruising or bleeding easily. Please tell your therapist and check with a doctor before massage.",noDeep:"Deep or strong pressure is best avoided.",sleepTip:"Sleep: a steady bedtime and no screens 30 minutes before bed may help.",allClear:"No special notes. You can still share anything else with your therapist before your session.",restart:"Start over",saved:"Saved on this device at",book:"Book a test session",bookNote:"Test booking only: saved on this device, nothing sent, no payment.",bookLead:"Ready to unwind? Book a session with Êm Wellness.",disc:"This intake only helps you and your therapist prepare for a massage. It is not medical advice or a diagnosis. If you have health concerns, please talk to a doctor."}};
// QS: [id, vi, en, viOpts, enOpts, multi]
const QS=[
["sleepTrouble","Bạn có thường xuyên khó ngủ không?","How often do you have trouble sleeping?",["Không bao giờ","Hiếm khi","Thỉnh thoảng","Thường xuyên","Luôn luôn"],["Never","Rarely","Sometimes","Often","Always"]],
["bedtime","Bạn thường đi ngủ lúc mấy giờ?","What time do you usually go to sleep?",["Trước 22h","22h – 0h","0h – 2h","Sau 2h","Không cố định"],["Before 10pm","10pm – midnight","Midnight – 2am","After 2am","It varies"]],
["smoke","Bạn có hút thuốc thường xuyên không?","How often do you smoke?",["Không hút","Thỉnh thoảng","Hằng tuần","Hằng ngày"],["Never","Occasionally","Weekly","Daily"]],
["alcohol","Bạn có uống rượu bia thường xuyên không?","How often do you drink alcohol?",["Không uống","Thỉnh thoảng","Hằng tuần","Hằng ngày"],["Never","Occasionally","Weekly","Daily"]],
["exercise","Bạn tập thể dục thường xuyên đến mức nào?","How often do you exercise?",["Hiếm khi hoặc không","1–2 lần/tuần","3–4 lần/tuần","5 lần/tuần trở lên"],["Rarely or never","1–2× a week","3–4× a week","5+× a week"]],
["pain","Bạn đang bị đau ở đâu?","Where do you have pain?",["Cổ","Vai","Lưng trên","Lưng dưới","Tay / bàn tay","Chân / đầu gối","Bàn chân","Đầu","Không đau"],["Neck","Shoulders","Upper back","Lower back","Arms / hands","Legs / knees","Feet","Head","No pain"],true],
["nerve","Bạn có gặp vấn đề nào về thần kinh không?","Do you have any nerve-related issues?",["Không","Tê hoặc châm chích","Đau dây thần kinh (vd: thần kinh tọa)","Đã được chẩn đoán bệnh lý thần kinh","Không chắc"],["No","Numbness or tingling","Nerve pain (e.g. sciatica)","Diagnosed nerve condition","Not sure"]],
["infectious","Bạn có đang sống chung với HIV/AIDS hoặc một bệnh có thể lây truyền khác không?","Are you living with HIV/AIDS or another transmissible (infectious) condition?",["Không","Có","Không muốn trả lời"],["No","Yes","Prefer not to say"]],
["skin","Bạn có vết thương hở, bầm tím hoặc dễ chảy máu trên da không?","Do you have any bleeding on your skin (open wounds, bruising, bleeding easily)?",["Không","Có"],["No","Yes"]]];
const PAIN=5,NOPAIN=8;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const RKEY=CONFIG.storageKey+"-intake2";store.del(CONFIG.storageKey); // old scored results are obsolete
let lang=store.get(CONFIG.storageKey+"-lang")||CONFIG.defaultLang,i=-1,ans=[],busy=false;
const $=id=>document.getElementById(id),app=$("app");
function valid(a){return Array.isArray(a)&&a.length===QS.length&&a.every((v,k)=>QS[k][5]?Array.isArray(v)&&v.length>0&&v.every(x=>x>=0&&x<QS[k][3].length):Number.isInteger(v)&&v>=0&&v<QS[k][3].length)}
function load(){try{const d=JSON.parse(store.get(RKEY));return d&&valid(d.ans)?d:null}catch(e){return null}}
function setLang(l){lang=l;store.set(CONFIG.storageKey+"-lang",l);document.documentElement.lang=l;render()}
$("acct").onclick=g(()=>{menuOpen=!menuOpen;renderHeader()});$("vi").onclick=()=>setLang("vi");$("en").onclick=()=>setLang("en");
function flags(a){if(!valid(a))return null;const n=a[6]>=1&&a[6]<=3,inf=a[7]==1,skin=a[8]==1;return{nerve:n,inf,skin,any:n||inf||skin}}
function flagList(a,l){const f=flags(a),t=T[l];if(!f||!f.any)return[];const o=[];if(f.nerve)o.push(t.flagNerve);if(f.inf)o.push(t.flagInf);if(f.skin)o.push(t.flagSkin);o.push(t.noDeep);return o}
const opt=(k,v)=>QS[k][lang=="vi"?3:4][v];
function ansText(k,v){return QS[k][5]?v.map(x=>opt(k,x)).join(", "):opt(k,v)}
function render(){const t=T[lang];$("notice").textContent=t.notice;$("vi").className=lang=="vi"?"on":"";$("en").className=lang=="en"?"on":"";renderHeader();if(view=="auth")return renderAuth();if(view)return renderBook();
if(i<0){const last=load();app.innerHTML=`<div class="card"><img class="hero" src="logo.png" alt=""><h1>${t.title}</h1><p class="muted">${t.intro}</p><p class="privacy">${t.privacy}</p>${getP()?`<p class="muted">${AT[lang].hi}, <b>${esc(getP().name)}</b> 👋</p>`:`<button class="linkb" id="sin">${AT[lang].startIn}</button>`}<div class="nav"><button class="primary" id="go">${t.start}</button><button id="sbook">${t.book}</button>${last?`<button id="last">${t.resume}</button>`:""}</div><div class="disc">${t.disc}</div></div>`;
$("go").onclick=()=>{i=0;ans=[];render()};$("sbook").onclick=g(openBook);if($("sin"))$("sin").onclick=g(()=>openAuth("in"));if(last)$("last").onclick=()=>{ans=last.ans;i=QS.length;render()};return}
if(i<QS.length){const q=QS[i],m=!!q[5],isSel=k=>m?(ans[i]||[]).includes(k):ans[i]===k;
app.innerHTML=`<div class="muted">${t.q} ${i+1}${t.of}${QS.length}</div><div class="bar" role="progressbar" aria-valuenow="${i}" aria-valuemax="${QS.length}"><i style="width:${i/QS.length*100}%"></i></div><div class="card"><h2>${lang=="vi"?q[1]:q[2]}</h2>${m?`<p class="muted">${t.multi}</p>`:""}<div class="opts${m?" multi":""}">${q[lang=="vi"?3:4].map((o,k)=>`<button data-k="${k}" class="${isSel(k)?"sel":""}" aria-pressed="${isSel(k)}">${o}</button>`).join("")}</div><div class="nav"><button id="bk" ${i==0?"disabled":""}>${t.back}</button><p class="err" id="qmiss" hidden>${lang=="vi"?"Hãy chọn một câu trả lời để tiếp tục.":"Please choose an answer to continue."}</p><button class="primary" id="nx">${i==QS.length-1?t.finish:t.next}</button></div></div>`;
const bs=[...app.querySelectorAll(".opts button")],paint=()=>bs.forEach(x=>{const on=isSel(+x.dataset.k);x.classList.toggle("sel",on);x.setAttribute("aria-pressed",on)});let tl=0;
bs.forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(m){const now=Date.now();if(now-tl<250)return;tl=now;let a=(ans[i]||[]).slice();if(a.includes(k))a=a.filter(x=>x!==k);else if(k===NOPAIN)a=[k];else a=a.filter(x=>x!==NOPAIN).concat(k);ans[i]=a.sort((x,y)=>x-y)}else ans[i]=k;paint();$("qmiss").hidden=true});
$("bk").onclick=()=>{if(busy||i==0)return;busy=true;setTimeout(()=>busy=false,400);i--;render()};$("nx").onclick=()=>{if(busy)return;if(ans[i]==null||(m&&!ans[i].length)){$("qmiss").hidden=false;return}busy=true;setTimeout(()=>busy=false,400);i++;if(i==QS.length)save();render()};return}
const saved=load(),pain=ans[PAIN].filter(x=>x!==NOPAIN),fl=flagList(ans,lang),notes=[];
notes.push(pain.length?`${t.focus} <b>${pain.map(x=>opt(PAIN,x)).join(", ")}</b>`:t.nofocus);if(ans[0]>=3||ans[1]>=2)notes.push(t.sleepTip);
app.innerHTML=`<div class="stack"><div class="card"><div class="cat">${t.res}</div><h2>${t.answers}</h2><dl class="rev sum">${QS.map((q,k)=>`<dt>${k+1}. ${lang=="vi"?q[1]:q[2]}</dt><dd>${ansText(k,ans[k])}</dd>`).join("")}</dl></div>
${fl.length?`<div class="card flags" role="note"><h2>⚠︎ ${t.flagT}</h2><ul>${fl.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}
<div class="card"><h2>${t.notes}</h2><ul>${notes.map(x=>`<li>${x}</li>`).join("")}${fl.length?"":`<li>${t.allClear}</li>`}</ul></div>
<div class="card book"><h2>${t.bookLead}</h2><button class="primary big" id="bookbtn">${t.book}</button><p class="muted" style="margin:10px 0 0">${t.bookNote} <a href="${CONFIG.bookingUrl}" target="_blank" rel="noopener">${BT[lang].pilot}</a></p></div><div class="card">${saved?`<p class="muted">${t.saved} ${new Date(saved.at).toLocaleString(lang=="vi"?"vi-VN":"en-US")}</p>`:""}<button class="primary" id="rs">${t.restart}</button></div><div class="disc">${t.disc}</div></div>`;
$("bookbtn").onclick=g(openBook);$("rs").onclick=()=>{i=0;ans=[];busy=false;render();scrollTo(0,0)}}
